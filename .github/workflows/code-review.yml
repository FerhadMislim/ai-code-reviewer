name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            **.py
            **.js
            **.ts
            **.java
            **.cpp
            **.go
            **.rs
    
      - name: Run AI Code Review
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.MODELS_GITHUB_TOKEN }}
        run: |
          mkdir -p review-results
          
          # Review each changed file
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Reviewing $file..."
            # Create a safe filename for the report
            report_file=$(echo "$file" | sed 's|/|_|g').json
            python code_reviewer.py review "$file" --format json --output "review-results/$report_file" || true
          done
          
          # Generate combined markdown report from JSON files
          python code_reviewer.py summarize review-results/ --format markdown --output review-results/summary.md || true
      
      - name: Comment on PR
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read the summary report
            let comment = '## 🤖 AI Code Review Results\n\n';
            
            try {
              const summary = fs.readFileSync('review-results/summary.md', 'utf8');
              comment += summary;
            } catch (error) {
              comment += 'Unable to generate review summary.\n';
              console.error(error);
            }
            
            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
